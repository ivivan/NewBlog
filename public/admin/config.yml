backend:
  name: git-gateway
  branch: main

# Uncomment for local development when using the Decap local backend.
# local_backend: true

media_folder: public/assets/images/posts
public_folder: /assets/images/posts

publish_mode: simple

collections:
  - name: posts
    label: Posts
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: "posts/{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - {
          label: Read Time,
          name: readTime,
          widget: string,
          default: "5 min read",
          required: false
        }
      - {
          label: Featured Image,
          name: image,
          widget: image,
          required: false,
          default: "/assets/images/posts/post1.jpg"
        }
      - { label: Slug, name: slug, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
